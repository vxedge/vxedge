syntax = "proto3";

package vxedge.v1;

import "vxedge/v1/common.proto";
import "vxedge/v1/jobs.proto";
import "vxedge/v1/lifecycle.proto";

// A run is one provisioned workspace on this host. It starts when the gateway comes up, survives a
// repeated `up` and a daemon restart, and ends when the gateway goes down. The host runs several at
// once, each in its own instance slot (`ARCHITECTURE.md` §6.0.5).
message Run {
  string id = 1;
  // RESOURCE_KIND_VEHICLE or RESOURCE_KIND_EXPERIMENT.
  ResourceKind kind = 2;
  // The workspace's id.
  string target_id = 3;
  // The workspace identity (`ARCHITECTURE.md` §13), computed under
  // `workspace_identity_algorithm`.
  string workspace_sha256 = 4;
  ResourceState state = 5;
  int64 started_unix_ms = 6;
  // The rule that computed `workspace_sha256`: `vxws/2` for a run started by this daemon,
  // `vxws/1` for one recorded before `vxws/2` existed, `sha256` for a manifest passed inline with
  // no workspace directory (the hash of that document). Identities under different algorithms
  // are not comparable.
  string workspace_identity_algorithm = 7;
  // The `vxp/1` package the run came from (`ARCHITECTURE.md` §13). Unset for an inline manifest
  // or a directory without a `vxp.yaml`, and for a run recorded before packages were.
  PackageRef package = 8;
  // Whether `up` checked the package's lock: false only for `up --unlocked`. Meaningful only
  // with `package`.
  bool package_locked = 9;
  // The kernel the run came up on. Unset for a run recorded before kernels were.
  Kernel kernel = 10;
  // How the gateway uplink shapes the slices (`ARCHITECTURE.md` §6.0.3): `gate-schedule` for
  // `network.shaping`'s IEEE 802.1Qbv schedule, `htb` for the HTB tree. Empty for a run recorded
  // before shaping was.
  string shaping = 11;
  // The gateway's time sync (`ARCHITECTURE.md` §6.0.3): `gptp` for `network.time_sync`'s IEEE
  // 802.1AS domain, which runs on software timestamps with free-running followers; empty for a
  // run without one, or recorded before time sync was.
  string time_sync = 12;
  // The instance slot the run holds on its host (`ARCHITECTURE.md` §6.0.5).
  string instance = 13;
}

// A `vxp/1` package as a result cites it.
message PackageRef {
  // `namespace/name`.
  string id = 1;
  string version = 2;
  // The package digest, `sha256:…`: the SHA-256 of the packed bytes, which `sha256sum` of a
  // packed file reproduces.
  string digest = 3;
}

// The kernel a run ran on. `kernel.preempt_rt: preferred` runs on either kind, so results say
// which.
message Kernel {
  // As `uname -r` prints it.
  string release = 1;
  // A PREEMPT_RT kernel.
  bool preempt_rt = 2;
}

message RunGetRequest {
  RunRef run = 1;
}

message RunListRequest {}

message RunListResponse {
  repeated Run runs = 1;
}

message RunStatusRequest {
  // The runs to report. Empty means every run on the host.
  repeated RunRef runs = 1;
}

// One run's status: what `VehicleStatus` or `ExperimentStatus` holds for it, read once.
message RunStatus {
  // The run. For a named run that is not up, only `id` is set.
  Run run = 1;
  // The workspace's rollup.
  ResourceStatus status = 2;
  repeated ResourceStatus components = 3;
  GatewayStatus gateway = 4;
  // The zone and compute entries of `components`, typed.
  repeated NodeStatus nodes = 5;
  // Why there is no status: `ERROR_REASON_NO_ACTIVE_RUN` or `ERROR_REASON_RUN_MISMATCH` for a
  // named run that is not up, or the reason the read failed. Unspecified when the status is set.
  ErrorReason error_reason = 6;
  // The same, for people.
  string error_message = 7;
}

message RunStatusResponse {
  // Lowest slot first; named runs that are not up follow, in the order they were named.
  repeated RunStatus runs = 1;
}

message RunDownRequest {
  // The runs to take down. Set this or `all`, not both. A named run that is not up refuses the
  // call with ERROR_REASON_NO_ACTIVE_RUN or ERROR_REASON_RUN_MISMATCH, under the gRPC code
  // NOT_FOUND as `Get` uses, where a single run's verbs answer FAILED_PRECONDITION: branch on the
  // reason, never on the code.
  repeated RunRef runs = 1;
  // Every run on the host. With nothing up, the job succeeds and does nothing.
  bool all = 2;
}

service RunService {
  rpc Get(RunGetRequest) returns (Run);
  rpc List(RunListRequest) returns (RunListResponse);
  // Every run's status, or the named runs', in one call. A run that is not up or cannot be read
  // gets an entry with `error_reason`; the call answers for every other run.
  rpc Status(RunStatusRequest) returns (RunStatusResponse);
  // Take several runs down, or every run, as one `run.down` job. Each run's own `down` is a child
  // job carrying its `run_id`, one after another and best effort. Refused as a whole, before
  // anything is touched, when a running campaign holds any of their slots.
  rpc Down(RunDownRequest) returns (Job);
}
