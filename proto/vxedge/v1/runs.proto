syntax = "proto3";

package vxedge.v1;

import "vxedge/v1/common.proto";

// A run is one provisioned workspace on this host. It starts when the gateway comes up, survives a
// repeated `up` and a daemon restart, and ends when the gateway goes down. The host runs one at a
// time today, so `List` returns zero or one.
message Run {
  string id = 1;
  // RESOURCE_KIND_VEHICLE or RESOURCE_KIND_EXPERIMENT.
  ResourceKind kind = 2;
  // The workspace's id.
  string target_id = 3;
  // The workspace identity (`ARCHITECTURE.md` §13), computed under
  // `workspace_identity_algorithm`.
  string workspace_sha256 = 4;
  ResourceState state = 5;
  int64 started_unix_ms = 6;
  // The rule that computed `workspace_sha256`: `vxws/2` for a run started by this daemon,
  // `vxws/1` for one recorded before `vxws/2` existed, `sha256` for a manifest passed inline with
  // no workspace directory (the hash of that document). Identities under different algorithms
  // are not comparable.
  string workspace_identity_algorithm = 7;
  // The `vxp/1` package the run came from (`ARCHITECTURE.md` §13). Unset for an inline manifest
  // or a directory without a `vxp.yaml`, and for a run recorded before packages were.
  PackageRef package = 8;
  // Whether `up` checked the package's lock: false only for `up --unlocked`. Meaningful only
  // with `package`.
  bool package_locked = 9;
  // The kernel the run came up on. Unset for a run recorded before kernels were.
  Kernel kernel = 10;
  // How the gateway uplink shapes the slices (`ARCHITECTURE.md` §6.0.3): `gate-schedule` for
  // `network.shaping`'s IEEE 802.1Qbv schedule, `htb` for the HTB tree. Empty for a run recorded
  // before shaping was.
  string shaping = 11;
}

// A `vxp/1` package as a result cites it.
message PackageRef {
  // `namespace/name`.
  string id = 1;
  string version = 2;
  // The package digest, `sha256:…`: the SHA-256 of the packed bytes, which `sha256sum` of a
  // packed file reproduces.
  string digest = 3;
}

// The kernel a run ran on. `kernel.preempt_rt: preferred` runs on either kind, so results say
// which.
message Kernel {
  // As `uname -r` prints it.
  string release = 1;
  // A PREEMPT_RT kernel.
  bool preempt_rt = 2;
}

message RunGetRequest {
  RunRef run = 1;
}

message RunListRequest {}

message RunListResponse {
  repeated Run runs = 1;
}

service RunService {
  rpc Get(RunGetRequest) returns (Run);
  rpc List(RunListRequest) returns (RunListResponse);
}
