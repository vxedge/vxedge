syntax = "proto3";

package vxedge.v1;

import "vxedge/v1/common.proto";
import "vxedge/v1/package.proto";

// ---------------------------------------------------------------------------
// Results (ARCHITECTURE.md section 13): the archives a host holds, described from each archive's
// own `metadata.json` only, and fetched by digest. An archive is found from a campaign's record,
// or in a workspace's `results/` folder.
// ---------------------------------------------------------------------------

message ResultListRequest {
  // Only this campaign's trial archives.
  string campaign_id = 1;
  // Also every archive under this workspace's `results/` folder.
  ManifestRef workspace = 2;
}

message ResultTrial {
  string campaign_id = 1;
  string trial_id = 2;
  string arm = 3;
  uint32 repetition = 4;
  map<string, ParamValue> parameters = 5;
}

message ResultInfo {
  // `sha256:<hex>` of the archive's bytes: how `Get` and `Fetch` name it.
  string digest = 1;
  // Where it is on the daemon's host.
  string path = 2;
  uint64 size_bytes = 3;
  // `vxarchive/2`, or `vxarchive/1` for an archive that names none.
  string archive = 4;
  string experiment_id = 5;
  // The package it ran, when its metadata names one.
  string package_id = 6;
  string package_version = 7;
  string package_digest = 8;
  // Whether the run checked the package's lock; unset when the archive does not say.
  optional bool package_locked = 9;
  // The trial it is, when a campaign wrote it.
  ResultTrial trial = 10;
  int64 collected_unix_ms = 11;
  string vxtelemetry_version = 12;
  string kernel_release = 13;
}

message ResultList {
  repeated ResultInfo results = 1;
}

message ResultGetRequest {
  string digest = 1;
}

message ResultFetchRequest {
  string digest = 1;
}

// One part of an archive. The first carries its digest and size.
message ResultChunk {
  string digest = 1;
  uint64 size_bytes = 2;
  bytes data = 3;
}

message ResultVerdictRequest {
  // The campaign whose trials are judged.
  string campaign_id = 1;
}

// What a criterion, or a whole verdict, found. `inconclusive` is never a pass.
enum VerdictOutcome {
  VERDICT_OUTCOME_UNSPECIFIED = 0;
  VERDICT_OUTCOME_PASS = 1;
  VERDICT_OUTCOME_FAIL = 2;
  VERDICT_OUTCOME_INCONCLUSIVE = 3;
}

// One metric a criterion read: under which selection, from which trials, and the aggregate taken.
message VerdictRead {
  string metric = 1;
  string aggregate = 2;
  map<string, ParamValue> select = 3;
  // The trials read, and each one's value, in the same order.
  repeated string trials = 4;
  repeated double values = 5;
  // Whether every selected trial gave a value from complete telemetry.
  bool complete = 6;
  // The aggregate, before the operand's factor and offset; unset when there is none.
  optional double value = 7;
}

// How one criterion was judged.
message CriterionVerdict {
  string id = 1;
  VerdictOutcome outcome = 2;
  // `lt`, `le`, `gt`, `ge`, `within` or `outside` for a comparison; `all` or `any` for a group.
  string rule = 3;
  // The operands' values, and the tolerance's; unset when an operand has none.
  optional double lhs = 4;
  optional double rhs = 5;
  optional double tolerance = 6;
  repeated VerdictRead reads = 7;
  repeated CriterionVerdict members = 8;
  repeated CriterionVerdict guards = 9;
  // Why it is inconclusive, for people.
  string why = 10;
}

// One metric's value in one trial.
message TrialMetricValue {
  optional double value = 1;
  bool complete = 2;
  string why = 3;
}

message VerdictTrial {
  string trial_id = 1;
  string arm = 2;
  uint32 repetition = 3;
  map<string, ParamValue> parameters = 4;
  // `sha256:<hex>` of the trial's archive.
  string archive_digest = 5;
  map<string, TrialMetricValue> values = 6;
}

// An experiment's criteria judged over a campaign's archives.
message ResultVerdict {
  string campaign_id = 1;
  string experiment_id = 2;
  string hypothesis = 3;
  // `pass` when every criterion passes, `fail` when one fails, else `inconclusive`.
  VerdictOutcome outcome = 4;
  repeated CriterionVerdict criteria = 5;
  // The archived trials judged. A trial that failed or was not archived is not among them.
  repeated VerdictTrial trials = 6;
}

message ResultCompareRequest {
  // The result, and the campaign it is compared with. Both are judged by the result's experiment.
  string campaign_id = 1;
  string reference_campaign_id = 2;
  // The workspace that holds the reference, for a campaign this host did not run, such as a
  // frozen campaign published with its archives. The reference is then that workspace's
  // `results/<reference_campaign_id>/campaign.json`. Each archive it names is read from that
  // folder, and must hash to the record's `sha256`, else `ERROR_REASON_CHECKSUM_MISMATCH`.
  // Unset: the reference is a campaign this host ran.
  ManifestRef reference_workspace = 3;
}

// One metric at one point: each side's median and IQR over its repetitions, and whether the
// result's median is within the reference's IQR of the reference's median.
message MetricDelta {
  string metric = 1;
  // The trial id without its `r<repetition>-` prefix: an arm's name, or parameter values.
  string point = 2;
  uint32 count = 3;
  uint32 reference_count = 4;
  double median = 5;
  double iqr = 6;
  double reference_median = 7;
  double reference_iqr = 8;
  // `median - reference_median`.
  double delta = 9;
  bool within_reference_iqr = 10;
}

message CriterionDelta {
  string id = 1;
  VerdictOutcome outcome = 2;
  VerdictOutcome reference_outcome = 3;
}

message ResultComparison {
  string campaign_id = 1;
  string reference_campaign_id = 2;
  VerdictOutcome outcome = 3;
  VerdictOutcome reference_outcome = 4;
  // Every metric at every point both campaigns archived, in the reference's order.
  repeated MetricDelta metrics = 5;
  repeated CriterionDelta criteria = 6;
  // How many of `metrics` are within the reference's IQR.
  uint32 within = 7;
}

service ResultService {
  // The archives the host's campaigns wrote, and those in a workspace's `results/`, newest first.
  rpc List(ResultListRequest) returns (ResultList);
  // One archive by digest.
  rpc Get(ResultGetRequest) returns (ResultInfo);
  // The archive's bytes, by digest, so a client that shares no filesystem with the daemon can
  // rerun from it.
  rpc Fetch(ResultFetchRequest) returns (stream ResultChunk);
  // The experiment's criteria judged over a campaign's archives, read again from the archives
  // each time.
  rpc Verdict(ResultVerdictRequest) returns (ResultVerdict);
  // A campaign against a reference campaign, metric by metric at each point and criterion by
  // criterion, from their archives. The reference is one this host ran, or one recorded in a
  // workspace's `results/` folder.
  rpc Compare(ResultCompareRequest) returns (ResultComparison);
}
