syntax = "proto3";

package vxedge.v1;

import "vxedge/v1/common.proto";
import "vxedge/v1/jobs.proto";

// ---------------------------------------------------------------------------
// Gateway (vxgateway — the virtual edge gateway)
// ---------------------------------------------------------------------------

message GatewayApplyRequest {
  ManifestRef manifest = 1;
}

message GatewayUpRequest {
  ManifestRef manifest = 1;
  // Skip the `vxp.lock` check while authoring (`up --unlocked`). The run records that it ran
  // unlocked (`Run.package_locked`), so its result is never mistaken for a locked one. Ignored
  // for an inline manifest or a directory without a `vxp.yaml`, which are never lock-checked.
  bool unlocked = 2;
}

message GatewayDownRequest {
  ManifestRef manifest = 1;
}

message GatewayStatusRequest {}

message GatewayStatus {
  ResourceStatus status = 1;
  // Per-slice observed state (VLAN, queue tree, counters summary).
  repeated SliceStatus slices = 2;
  // Per-link harness impairments actually observed on the kernel (both netem
  // directions) — empty if none are declared. Was previously folded into
  // `status.detail` as free text only; addressable per-link here so a
  // `--json` client doesn't have to parse prose to tell which link is
  // impaired or whether one direction dropped.
  repeated ImpairmentStatus impairments = 3;
  // Per-endpoint ingress anti-spoof filters actually observed on the kernel — empty if no
  // endpoint declares a pinned source address. UP means the filter is installed; DOWN means a
  // declared filter is missing, which `GatewayService.Up` already refuses to converge on.
  repeated IngressFilterStatus ingress_filters = 4;
  // Gateway-terminated WireGuard tunnels actually observed on the kernel — empty if none are
  // declared. UP means the interface exists and is configured; a tunnel's own public key
  // (`TunnelStatus.public_key`) is read live off the kernel, since a manifest never declares
  // this side's key material (see `model::Tunnel`'s doc comment).
  repeated TunnelStatus tunnels = 5;
}

message SliceStatus {
  string slice_id = 1;
  ResourceState state = 2;
  string detail = 3;
}

message ImpairmentStatus {
  string link = 1;
  string access_port = 2;
  // UP: both netem directions present. DEGRADED: exactly one — an
  // asymmetric wire nobody asked for, always a bug. DOWN: neither.
  ResourceState state = 3;
  string detail = 4;
}

message IngressFilterStatus {
  string node = 1;
  string access_port = 2;
  // UP or DOWN only — a filter is either installed or it isn't, no partial state.
  ResourceState state = 3;
  string detail = 4;
}

// `wireguard` (a routed L3 endpoint, encrypted, connection-oriented) and `vxlan` (joins the
// bridge as a trunk-like port, unencrypted, connectionless — no key material or handshake
// concept at all) are structurally opposite kinds under one `network.tunnels` block
// (`docs/ARCHITECTURE.md` §6.0.3). `TunnelStatus.kind` lets a client tell them apart instead of
// inferring it from `public_key`/`handshake_established` being empty/false, which is also what
// an unestablished wireguard tunnel looks like.
enum TunnelKind {
  TUNNEL_KIND_UNSPECIFIED = 0;
  TUNNEL_KIND_WIREGUARD = 1;
  TUNNEL_KIND_VXLAN = 2;
}

message TunnelStatus {
  string id = 1;
  // UP or DOWN only, like IngressFilterStatus — a tunnel interface either exists and is
  // configured, or it doesn't. A missing handshake is *not* DEGRADED: WireGuard is
  // connectionless, so a correctly configured, idle tunnel has no handshake yet and that is
  // not a fault (see `TunnelObservation::handshake_established`'s own doc comment).
  ResourceState state = 2;
  // This side's current public key, read live off the kernel — hand this to the peer so it can
  // be configured as their `peer.public_key`. Empty when the tunnel isn't up, and always empty
  // for a `TUNNEL_KIND_VXLAN` entry — vxlan has no key material at all.
  string public_key = 3;
  // Always `false` for a `TUNNEL_KIND_VXLAN` entry — vxlan has no handshake concept, not merely
  // an unestablished one.
  bool handshake_established = 4;
  string detail = 5;
  TunnelKind kind = 6;
}

service GatewayService {
  // Validate + stage without starting (plan/diff semantics).
  rpc Apply(GatewayApplyRequest) returns (Job);
  rpc Up(GatewayUpRequest) returns (Job);
  rpc Down(GatewayDownRequest) returns (Job);
  rpc Status(GatewayStatusRequest) returns (GatewayStatus);
}

// ---------------------------------------------------------------------------
// Zones & Compute (mirrored surface)
// ---------------------------------------------------------------------------

message ZoneApplyRequest {
  ManifestRef manifest = 1;
}

// `run`, here and on the requests below: empty means the only run, and a run that is not the active
// one is refused with `ERROR_REASON_RUN_MISMATCH`.
message ZoneUpRequest {
  VxidRef ref = 1;
  RunRef run = 2;
}

message ZoneDownRequest {
  VxidRef ref = 1;
  RunRef run = 2;
}

message ZoneListRequest {
  RunRef run = 1;
}

message ZoneListResponse {
  // Zone nodes. Hpc devices answer to `ComputeService`. Prefer `nodes`.
  repeated ResourceStatus zones = 1;
  repeated NodeStatus nodes = 2;
}

message ZoneRemoveRequest {
  VxidRef ref = 1;
}

// Client-streaming image push: first message carries metadata, the rest data.
message ImagePushRequest {
  oneof payload {
    ImageMeta meta = 1;
    bytes chunk = 2;
  }
}

message ImageMeta {
  string vxid = 1;
  string filename = 2;
  // Optional registry URL; empty = daemon-local store.
  string registry = 3;
  uint64 total_bytes = 4;
}

message ImagePushResponse {
  // SHA-256 digest under which the image was stored (reproducibility rule).
  string sha256 = 1;
  string stored_url = 2;
}

service ZoneService {
  // Not built. Manifests define the topology.
  rpc Apply(ZoneApplyRequest) returns (Job) {
    option deprecated = true;
  }
  rpc Up(ZoneUpRequest) returns (Job);
  rpc Down(ZoneDownRequest) returns (Job);
  rpc List(ZoneListRequest) returns (ZoneListResponse);
  // Not built. Manifests define the topology.
  rpc Remove(ZoneRemoveRequest) returns (Job) {
    option deprecated = true;
  }
  // Not built. Parts come from the registry.
  rpc PushImage(stream ImagePushRequest) returns (ImagePushResponse) {
    option deprecated = true;
  }
}

message ComputeApplyRequest {
  ManifestRef manifest = 1;
}

message ComputeUpRequest {
  VxidRef ref = 1;
  RunRef run = 2;
}

message ComputeDownRequest {
  VxidRef ref = 1;
  RunRef run = 2;
}

message ComputeListRequest {
  RunRef run = 1;
}

message ComputeListResponse {
  // Prefer `node_status`.
  repeated ResourceStatus nodes = 1;
  repeated NodeStatus node_status = 2;
}

message ComputeRemoveRequest {
  VxidRef ref = 1;
}

service ComputeService {
  // Not built. Manifests define the topology.
  rpc Apply(ComputeApplyRequest) returns (Job) {
    option deprecated = true;
  }
  rpc Up(ComputeUpRequest) returns (Job);
  rpc Down(ComputeDownRequest) returns (Job);
  rpc List(ComputeListRequest) returns (ComputeListResponse);
  // Not built. Manifests define the topology.
  rpc Remove(ComputeRemoveRequest) returns (Job) {
    option deprecated = true;
  }
  // Not built. Parts come from the registry.
  rpc PushImage(stream ImagePushRequest) returns (ImagePushResponse) {
    option deprecated = true;
  }
}

// ---------------------------------------------------------------------------
// Services (ota, telemetry) — declared by an experiment or a vehicle, and on a vehicle placed on a
// device with `on:`. `SvcService` never starts the signal plane, which has a stage of its own.
// ---------------------------------------------------------------------------

message SvcUpRequest {
  // "ota" | "telemetry" (§8: only these two types for now). Up, Down and Status
  // answer any other value, or none, with INVALID_ARGUMENT naming the accepted ones.
  string service_type = 1;
  // The workspace, experiment or bare vehicle. On Down and Status, unset means the active one.
  ManifestRef experiment = 2;
  RunRef run = 3;
}

message SvcDownRequest {
  string service_type = 1;
  ManifestRef experiment = 2;
  RunRef run = 3;
}

message SvcStatusRequest {
  string service_type = 1;
  ManifestRef experiment = 2;
  RunRef run = 3;
}

service SvcService {
  rpc Up(SvcUpRequest) returns (Job);
  rpc Down(SvcDownRequest) returns (Job);
  rpc Status(SvcStatusRequest) returns (ResourceStatus);
}

// ---------------------------------------------------------------------------
// Vehicle (ordered composition: gateway -> zones -> compute -> signal plane -> services)
// ---------------------------------------------------------------------------

// Up, Down and Status answer FAILED_PRECONDITION for a workspace that is not the active one, or
// when the host is running what this workspace does not declare: each acts on the host's one
// gateway. Up also refuses, before touching the host, a workspace that cannot provision, such as a
// missing `localhost/` image, guest bundle or capsule module.
message VehicleUpRequest {
  ManifestRef manifest = 1;
  // Restrict to specific stages (empty = all, in dependency order).
  repeated ExperimentStage stages = 2;
  // Skip the `vxp.lock` check while authoring (`up --unlocked`). The run records that it ran
  // unlocked (`Run.package_locked`), so its result is never mistaken for a locked one. Ignored
  // for an inline manifest or a directory without a `vxp.yaml`, which are never lock-checked.
  bool unlocked = 3;
}

message VehicleDownRequest {
  ManifestRef manifest = 1;
  // Restrict to specific stages (empty = all, in reverse dependency order).
  repeated ExperimentStage stages = 2;
}

message VehicleStatusRequest {
  ManifestRef manifest = 1;
}

message VehicleStatus {
  ResourceStatus status = 1;
  repeated ResourceStatus components = 2;
  // The gateway as observed for this vehicle's workspace: per-slice VLANs and queues, ingress
  // filters, impairments and tunnels, which one line in `components` cannot carry.
  GatewayStatus gateway = 3;
  // The zone and compute entries of `components`, typed.
  repeated NodeStatus nodes = 4;
}

service VehicleService {
  rpc Up(VehicleUpRequest) returns (Job);
  rpc Down(VehicleDownRequest) returns (Job);
  rpc Status(VehicleStatusRequest) returns (VehicleStatus);
}

// ---------------------------------------------------------------------------
// Experiment & Traffic
// ---------------------------------------------------------------------------

// One stage of bringing an experiment up. Named because a campaign frequently wants a
// *subset*: exp-001 measures on the host-side veth peers and deliberately never starts its
// zones, and exp-002's isolation contract is exactly one packaging arm running at a time, so
// an all-or-nothing `up` would start all three and reintroduce the concurrent-guest CPU
// contention that invalidated exp-002b's first campaign.
enum ExperimentStage {
  EXPERIMENT_STAGE_UNSPECIFIED = 0;
  EXPERIMENT_STAGE_GATEWAY = 1;
  EXPERIMENT_STAGE_ZONES = 2;
  EXPERIMENT_STAGE_SERVICES = 3;
  EXPERIMENT_STAGE_COMPUTE = 4;
  EXPERIMENT_STAGE_SIGNAL_PLANE = 5;
  // `network.time_sync`'s followers, each in its device's container group. The grandmaster is
  // the gateway's, so the gateway stage starts it.
  EXPERIMENT_STAGE_TIME_SYNC = 6;
}

message ExperimentUpRequest {
  ManifestRef manifest = 1;
  // Restrict to specific stages (empty = all, in dependency order). Individual devices are
  // still addressed with ZoneService.Up, which is how a campaign runs one arm at a time.
  repeated ExperimentStage stages = 2;
  // Skip the `vxp.lock` check while authoring (`up --unlocked`). The run records that it ran
  // unlocked (`Run.package_locked`), so its result is never mistaken for a locked one. Ignored
  // for an inline manifest or a directory without a `vxp.yaml`, which are never lock-checked.
  bool unlocked = 3;
}

message ExperimentDownRequest {
  // Must name the experiment active on this host (same id, and same workspace directory when
  // both are known): any other answers FAILED_PRECONDITION naming the active one, since the
  // zones and gateway stages act on the active experiment, not on this manifest. With nothing
  // active, Down proceeds (idempotent).
  ManifestRef manifest = 1;
  // Restrict to specific stages (empty = all, in reverse dependency order).
  repeated ExperimentStage stages = 2;
}

message ExperimentStatusRequest {
  ManifestRef manifest = 1;
}

message ExperimentStatus {
  ResourceStatus status = 1;
  repeated ResourceStatus components = 2;
  GatewayStatus gateway = 3;
  // The zone and compute entries of `components`, typed.
  repeated NodeStatus nodes = 4;
}

service ExperimentService {
  rpc Up(ExperimentUpRequest) returns (Job);
  rpc Down(ExperimentDownRequest) returns (Job);
  rpc Status(ExperimentStatusRequest) returns (ExperimentStatus);
}

message TrafficUpRequest {
  ManifestRef manifest = 1;
  // Restrict to specific profiles (empty = all in manifest).
  repeated string profiles = 2;
  RunRef run = 3;
  // Traffic is a time-bounded process, so `Up` does not converge. A retry with the same id returns
  // the original job instead of starting a second load run.
  string request_id = 4;
  // How long each generator runs, in seconds. 0 uses the experiment's `method.duration_s`.
  uint32 duration_s = 5;
}

message TrafficDownRequest {
  ManifestRef manifest = 1;
  repeated string profiles = 2;
  RunRef run = 3;
}

message TrafficStatusRequest {
  ManifestRef manifest = 1;
  RunRef run = 2;
}

enum TrafficProfileState {
  TRAFFIC_PROFILE_STATE_UNSPECIFIED = 0;
  TRAFFIC_PROFILE_STATE_RUNNING = 1;
  TRAFFIC_PROFILE_STATE_FINISHED = 2;
  TRAFFIC_PROFILE_STATE_FAILED = 3;
}

message TrafficProfileStatus {
  string id = 1;
  TrafficProfileState state = 2;
  string detail = 3;
}

message TrafficStatus {
  repeated TrafficProfileStatus profiles = 1;
}

service TrafficService {
  rpc Up(TrafficUpRequest) returns (Job);
  rpc Down(TrafficDownRequest) returns (Job);
  rpc Status(TrafficStatusRequest) returns (TrafficStatus);
}

// ---------------------------------------------------------------------------
// Measurements: what an experiment's `measurements` block declares, run by the daemon inside
// each end's network namespace (ARCHITECTURE.md section 6.0.3). Their samples reach the ingest
// through the daemon's exporter as the entity `measurements/<id>`.
// ---------------------------------------------------------------------------

message MeasurementStartRequest {
  // The workspace whose measurements to start; its experiment must be up.
  ManifestRef manifest = 1;
  // Restrict to these measurement ids (empty = every measurement).
  repeated string ids = 2;
  RunRef run = 3;
  // How long each sender runs. 0 uses the experiment's `method.duration_s`, else 10.
  uint32 duration_s = 4;
  // A retry with the same id returns the original job instead of starting the senders again.
  string request_id = 5;
}

message MeasurementStopRequest {
  ManifestRef manifest = 1;
  repeated string ids = 2;
  RunRef run = 3;
}

message MeasurementStatusRequest {
  ManifestRef manifest = 1;
  RunRef run = 2;
}

enum MeasurementState {
  MEASUREMENT_STATE_UNSPECIFIED = 0;
  MEASUREMENT_STATE_RUNNING = 1;
  MEASUREMENT_STATE_FINISHED = 2;
  MEASUREMENT_STATE_FAILED = 3;
}

message MeasurementStatus {
  string id = 1;
  // The entity its samples name, `measurements/<id>`.
  string entity = 2;
  // `rtt-probe`.
  string kind = 3;
  MeasurementState state = 4;
  string detail = 5;
}

message MeasurementStatusResponse {
  repeated MeasurementStatus measurements = 1;
}

service MeasurementService {
  // Start each selected measurement: its reflector, then its sender, for `duration_s`. A
  // measurement whose sender still runs is left as it is.
  rpc Start(MeasurementStartRequest) returns (Job);
  // Stop each selected measurement's processes. Idempotent.
  rpc Stop(MeasurementStopRequest) returns (Job);
  rpc Status(MeasurementStatusRequest) returns (MeasurementStatusResponse);
}

// ---------------------------------------------------------------------------
// NOS check (SONiC-VS production-NOS config-parity check — ARCHITECTURE.md §7,
// network.nos_check). Never part of ExperimentService.Up's provisioning sequence: this
// checks network.slices' VLAN intent against a real production NOS, alongside — never
// instead of — the actual measured data plane (network.data_plane). A missing or failed
// check never blocks or changes what an experiment measures.
// ---------------------------------------------------------------------------

message NosCheckUpRequest {
  ManifestRef experiment = 1;
  RunRef run = 2;
}

message NosCheckDownRequest {
  ManifestRef experiment = 1;
  RunRef run = 2;
}

message NosCheckStatusRequest {
  ManifestRef experiment = 1;
  RunRef run = 2;
}

message NosCheckStatus {
  ResourceStatus status = 1;
}

message NosCheckVerifyRequest {
  ManifestRef experiment = 1;
  RunRef run = 2;
  // Each check boots a fresh instance, so `Verify` does not converge. A retry with the same id
  // returns the original job.
  string request_id = 3;
}

service NosCheckService {
  // Boots a long-lived instance for manual inspection (`nos-check status`, a console attached
  // out of band). Distinct from `Verify`, which is self-contained and does its own fresh boot —
  // an `Up` instance is never reused by `Verify`, since a second console connection to an
  // already-logged-in guest would hang `Verify`'s own login sequence waiting for a `login:`
  // prompt that will not reappear.
  rpc Up(NosCheckUpRequest) returns (Job);
  rpc Down(NosCheckDownRequest) returns (Job);
  rpc Status(NosCheckStatusRequest) returns (NosCheckStatus);
  // Boots a fresh, disposable instance, logs in, loads the experiment's declared
  // `network.slices` onto it, and reads every field back to confirm parity — one atomic
  // sequence, always torn down when it completes. The result (fields checked, any mismatches)
  // is reported in the returned Job's `message`.
  rpc Verify(NosCheckVerifyRequest) returns (Job);
}
