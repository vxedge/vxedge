syntax = "proto3";

package vxedge.v1;

import "vxedge/v1/common.proto";

// One thing that would stop this workspace coming up.
message PlanProblem {
  ErrorReason reason = 1;
  // What it is about: a node, an image, a file.
  string subject = 2;
  string detail = 3;
}

message PlannedService {
  string vxid = 1;
  string service_type = 2;
  // The device it is placed on. Empty for a host process.
  string on = 3;
  string image = 4;
}

message HostCheck {
  string name = 1;
  bool passed = 2;
  string detail = 3;
}

message WorkspacePlanRequest {
  ManifestRef manifest = 1;
  // Plan as `up --unlocked` would run: no `ERROR_REASON_LOCK_MISMATCH` problem.
  bool unlocked = 2;
}

message WorkspacePlan {
  // True when `problems` is empty.
  bool valid = 1;
  repeated PlanProblem problems = 2;
  repeated NodeSpec nodes = 3;
  repeated PlannedService services = 4;
  // Every image the workspace would run.
  repeated string images = 5;
  repeated HostCheck host_checks = 6;
  // Every entity of the model (`ARCHITECTURE.md` §12): the paths telemetry records name, with
  // the scrape targets bound to each. Derived from ids, never from addresses.
  repeated PlannedEntity entities = 7;
}

// One entity: `<vehicle>/<zone>/<node>` (`_` for no zone), `<vehicle>/links/<link>`,
// `<vehicle>/channels/<channel>`, `<vehicle>/slices/<slice>`, `<vehicle>/services/<service>`,
// `host/services/<service>` or `host`.
message PlannedEntity {
  string path = 1;
  // `node`, `link`, `channel`, `slice`, `service` or `host`.
  string kind = 2;
  // A node's role (`zone-controller`, `hpc`, ...) or a service's type (`ota`, ...).
  string role = 3;
  // A node's backend, as the manifest spells it.
  string backend = 4;
  // What runs on a node: each function's part, as the documents pin it.
  repeated EntityPayload payloads = 5;
  // The telemetry scrape targets bound to this entity.
  repeated string scrape_targets = 6;
  // The log files the daemon writes for this entity, which its telemetry service reads into log
  // records (`LogService.Follow`).
  repeated EntityLog logs = 7;
}

message EntityLog {
  // What the file is to its entity: `serial`, `vmm`, `stdout`, `attach` or
  // `traffic-<profile>-<role>`.
  string stream = 1;
  // Its path on the host.
  string path = 2;
}

message EntityPayload {
  string ref = 1;
  string digest = 2;
}

service WorkspaceService {
  // What `up` would do and whether it would be refused. Touches nothing on the host, and runs the
  // same checks as `up`, so the two cannot disagree.
  rpc Plan(WorkspacePlanRequest) returns (WorkspacePlan);
}

message BackendCapability {
  NodeBackend backend = 1;
  bool available = 2;
  string detail = 3;
}

message HostCapabilitiesRequest {}

message HostCapabilities {
  repeated BackendCapability backends = 1;
  // The part kinds this host can run: `container`, `bundle`, `wasm`.
  repeated string part_kinds = 2;
  // How many runs this host holds at once.
  uint32 max_runs = 3;
  // The best NVIDIA GPU the driver reports, the probe a workspace's `requires` is checked
  // against. Unset when there is none.
  HostGpu gpu = 4;
  // The package descriptor schemas this daemon reads, such as `vxp/1` (`ARCHITECTURE.md`
  // §6.0.3).
  repeated string package_schemas = 5;
  // The simulators a scenario can run on here (`esmini`, `carla`): those with an executable on
  // vxedged's `PATH` (`esmini`; `CarlaUE4.sh` or `CarlaUnreal.sh`).
  repeated string simulators = 6;
  // Whether the kernel has `taprio`, which renders `network.shaping`'s gate schedule
  // (`ARCHITECTURE.md` §6.0.3): its `sch_taprio` module is loaded, built in, or installed for the
  // running kernel. `Plan` and `up` refuse a workspace with `network.shaping` with
  // ERROR_REASON_HOST_REQUIREMENT_UNMET when it is false.
  bool taprio = 7;
}

message HostGpu {
  float compute_capability = 1;
  uint64 vram_mib = 2;
}

service HostService {
  rpc Capabilities(HostCapabilitiesRequest) returns (HostCapabilities);
}
