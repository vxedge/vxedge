name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --check

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          # vxAPI is the contract: PRs must not break it. Compared against main.
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main"
          push: false

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Privileged gateway integration tests: provisions bridge/VLAN/HTB inside a
  # network namespace. Hosted runners allow sudo; -E keeps rustup's HOME.
  netns-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wireguard-tools
        # tunnel_completes_a_real_handshake_between_two_simulated_hosts (network.tunnels
        # kind: wireguard, docs/TASKS.md #16) drives the real `wg` CLI for key generation and
        # peer configuration — rtnetlink covers device creation only, never wg's own
        # configuration protocol (see gateway::netlink's own doc comment). Found missing here
        # 2026-08-04: this was the first real CI run this test had ever gone through (verified
        # only locally, where `wg` is installed, since it landed 2026-08-03).
        run: sudo apt-get update && sudo apt-get install -y wireguard-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Gateway netns tests
        run: sudo -E env "PATH=$PATH" cargo test -p vxedge-core --test gateway_netns -- --ignored --nocapture
