[package]
name = "vxcapsule"
description = "Runs one WebAssembly capsule for a vxedge zone node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }
wasmtime = { version = "=49.0.5", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=49.0.5", default-features = false, features = ["p2"] }
