[package]
name = "vxedge-api"
description = "Generated Rust bindings for vxAPI (vxedge.v1) — do not hand-edit generated code"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
pbjson = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[features]
# Serde impls in the canonical Protobuf JSON mapping, for clients that return typed JSON.
serde = ["dep:pbjson", "dep:serde"]

[build-dependencies]
tonic-prost-build = { workspace = true }
pbjson-build = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
