[workspace]
resolver = "3"
members = [
    "crates/vxedge-api",
    "crates/vxedge-core",
    "crates/vxedged",
    "crates/vxedge-cli",
    "crates/vxcapsule",
]

[workspace.package]
publish = false
version = "0.14.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/vxedge/vxedge"

[workspace.dependencies]
vxedge-api = { path = "crates/vxedge-api" }
vxedge-core = { path = "crates/vxedge-core" }

tonic = "0.14"
tonic-prost = "0.14"
tonic-types = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
# Serde impls for vxedge-api's `serde` feature (canonical Protobuf JSON).
pbjson = "0.9"
pbjson-build = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "process", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
sha2 = "0.11"
# `.vxpignore` matching for the workspace identity (`vxws/2`). Only the gitignore matcher is
# used, never its directory walker, which reads global and environment ignore rules.
ignore = "0.4"
semver = { version = "1", features = ["serde"] }
tower = "0.5"
rtnetlink = "0.24"
futures-util = "0.3"
nix = { version = "0.31", features = ["sched", "user"] }
tun = "0.8"
hyper-util = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Archive v2 members are zstd-compressed (decision X-7); the verdict engine reads them.
zstd = { version = "0.13", default-features = false }
# Podman's Docker-compatible REST API over the rootless user socket. Unix-socket transport
# only: no TLS stack, no HTTP/SSH remotes.
cloud-hypervisor-client = "=0.6.0"
bollard = { version = "0.21", default-features = false, features = ["pipe"] }
