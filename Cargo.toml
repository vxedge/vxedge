[workspace]
resolver = "3"
members = [
    "crates/vxedge-api",
    "crates/vxedge-core",
    "crates/vxedged",
    "crates/vxedge-cli",
]

[workspace.package]
publish = false
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/vxedge/vxedge"

[workspace.dependencies]
vxedge-api = { path = "crates/vxedge-api" }
vxedge-core = { path = "crates/vxedge-core" }

tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
sha2 = "0.11"
tower = "0.5"
rtnetlink = "0.23"
futures-util = "0.3"
nix = { version = "0.31", features = ["sched", "user"] }
tun = "0.8"
hyper-util = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
