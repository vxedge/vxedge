[workspace]
resolver = "2"
members = [
    "crates/vxedge-api",
    "crates/vxedge-core",
    "crates/vxedged",
    "crates/vxedge-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vxedge/vxedge"

[workspace.dependencies]
vxedge-api = { path = "crates/vxedge-api" }
vxedge-core = { path = "crates/vxedge-core" }

tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = "0.4"
hyper-util = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
