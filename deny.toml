# cargo-deny configuration — supply-chain hygiene (advisories, licenses, sources).
# Run locally: cargo deny check   (CI runs it on every push/PR)

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste (proc-macro) is unmaintained upstream (archived by its author) — pulled in
    # transitively by netlink-packet-core 0.8.1, itself required by rtnetlink 0.21.0 (the
    # rtnetlink port, docs/ROADMAP.md, delivered 2026-08-04). Both are already the latest
    # published versions (confirmed via `cargo search`/`cargo tree -i paste` before adding
    # this exception, 2026-08-04) — no upgrade removes the dependency, and the advisory
    # itself states no safe replacement exists for `paste`. It compiles away entirely (a
    # proc-macro with no runtime presence), so this is a maintenance-signal risk, not a
    # supply-chain/security one. Re-check when rtnetlink/netlink-packet-core next release.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    # Added 2026-08-05 for `tun` (docs/ROADMAP.md, tap device creation — the vetted binding
    # crate `rust-patterns` requires in place of hand-rolled `unsafe` ioctl code). Both are
    # OSI-approved, FSF-free permissive licenses functionally equivalent in effect to MIT —
    # no copyleft, no legal concern, checked before allowing rather than assumed:
    #   - "ISC": pulled in by `libloading`, itself only reachable via `tun`'s optional
    #     `wintun-bindings` (Windows-only backend) — never compiled for this Linux-only
    #     workspace, but present in the full dependency graph cargo-deny checks regardless.
    #   - "WTFPL": `tun` crate's own declared license.
    "ISC",
    "WTFPL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# In-workspace path deps carry no version by design; only external wildcards are banned.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
