# cargo-deny configuration — supply-chain hygiene (advisories, licenses, sources).
# Run locally: cargo deny check   (CI runs it on every push/PR)

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# In-workspace path deps carry no version by design; only external wildcards are banned.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
